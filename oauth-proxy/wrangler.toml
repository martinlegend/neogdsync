name = "neogdsync-oauth"
main = "worker.js"
compatibility_date = "2024-01-01"

# Free workers.dev subdomain — HTTPS included, no custom domain needed.
# After deploy the URL will be: https://neogdsync-oauth.<your-subdomain>.workers.dev
#
# Secrets (set via CLI, never stored here):
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
